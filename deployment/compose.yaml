services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sems}
      POSTGRES_USER: ${POSTGRES_USER:-sems_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - sems_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sems_user} -d ${POSTGRES_DB:-sems}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sems}
      DB_USERNAME: ${POSTGRES_USER:-sems_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SEMS_JWT_SECRET: ${SEMS_JWT_SECRET:?Set SEMS_JWT_SECRET in .env}
      SEMS_JWT_ISSUER: ${SEMS_JWT_ISSUER:-sems-api}
      SEMS_JWT_TTL: ${SEMS_JWT_TTL:-PT30M}
      SEMS_BOOTSTRAP_ADMIN_USERNAME: ${SEMS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SEMS_BOOTSTRAP_ADMIN_EMAIL: ${SEMS_BOOTSTRAP_ADMIN_EMAIL:-}
      SEMS_BOOTSTRAP_ADMIN_PASSWORD: ${SEMS_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  sems_postgres_data:
