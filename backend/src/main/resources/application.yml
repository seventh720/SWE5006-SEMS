server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sems-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sems}
    username: ${DB_USERNAME:sems_user}
    password: ${DB_PASSWORD:sems_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

sems:
  security:
    jwt:
      secret: ${SEMS_JWT_SECRET}
      issuer: ${SEMS_JWT_ISSUER:sems-api}
      ttl: ${SEMS_JWT_TTL:PT30M}
  bootstrap:
    admin:
      username: ${SEMS_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${SEMS_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${SEMS_BOOTSTRAP_ADMIN_PASSWORD:}
