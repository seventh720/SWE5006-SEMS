sems:
  notifications:
    reminders-enabled: false
  security:
    jwt:
      secret: integration-test-secret-with-at-least-32-characters
      issuer: sems-test
      ttl: PT5M
  bootstrap:
    admin:
      username: admin
      email: ""
      password: ""

# Keep failures visible without dumping SQL or authentication request/response bodies.
logging:
  level:
    root: WARN
    org.springframework.web: INFO
    org.hibernate: WARN
