name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: npm ci
        working-directory: frontend
      - name: Run lint and collect reports
        run: bash scripts/ci/lint.sh
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report
          path: lint-reports/
          retention-days: 7


  security:
    name: Security · SAST, Dependencies & Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-jar
          path: backend/target/
      - run: bash scripts/security/scan.sh
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sast-report
          path: security-reports/semgrep.json
          retention-days: 7
      - name: Upload dependency and secret reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-secret-reports
          path: security-reports/trivy-*.json
          retention-days: 7


  backend:
    name: Backend · Unit Tests
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.line }}
      branch_coverage: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile, test and generate backend coverage
        working-directory: backend
        run: mvn -B clean verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-jar
          path: backend/target/sems-backend-*.jar
          if-no-files-found: error
          retention-days: 1
      - name: Summarize unit-test coverage
        id: coverage
        if: always()
        run: python3 scripts/ci/backend-coverage.py backend/target/site/jacoco/jacoco.xml "Backend unit tests"
      - name: Upload unit-test coverage and results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-unit-coverage
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/

  backend-integration:
    name: Backend · Integration Tests
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.line }}
      branch_coverage: ${{ steps.coverage.outputs.branch }}
    env:
      RUN_CONTAINER_TESTS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit and PostgreSQL integration tests
        working-directory: backend
        run: mvn -B clean verify
      - name: Summarize combined coverage
        id: coverage
        if: always()
        run: python3 scripts/ci/backend-coverage.py backend/target/site/jacoco/jacoco.xml "Backend unit + PostgreSQL integration tests"
      - name: Upload combined coverage and results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-combined-coverage
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/

  frontend:
    name: Frontend · Tests & Build
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.line }}
      branch_coverage: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Summarize frontend coverage
        id: coverage
        if: always()
        run: python3 scripts/ci/frontend-coverage.py frontend/coverage/coverage-summary.json
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  notify:
    name: Notify · Telegram
    if: always()
    needs: [lint, security, backend, backend-integration, frontend]
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Telegram configuration check
        if: "${{ env.TELEGRAM_TO == '' || env.TELEGRAM_TOKEN == '' }}"
        run: echo "Telegram secrets are not configured; notification skipped."
      - name: Send Telegram message
        if: "${{ env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != '' }}"
        continue-on-error: true
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            ${{ needs.lint.result == 'success' && needs.security.result == 'success' && needs.backend.result == 'success' && needs['backend-integration'].result == 'success' && needs.frontend.result == 'success' && '✅ SEMS CI success' || '❌ SEMS CI failed' }}

            User: ${{ github.actor }}
            Repository: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit Message: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}

            Lint: ${{ needs.lint.result }}
            Static security: ${{ needs.security.result }}
            Backend: ${{ needs.backend.result }}
            Backend unit-test line coverage: ${{ needs.backend.outputs.coverage }}
            Backend unit-test branch coverage: ${{ needs.backend.outputs.branch_coverage }}
            Backend combined line coverage: ${{ needs['backend-integration'].outputs.coverage }}
            Backend combined branch coverage: ${{ needs['backend-integration'].outputs.branch_coverage }}
            PostgreSQL integration: ${{ needs['backend-integration'].result }}
            Frontend: ${{ needs.frontend.result }}
            Frontend line coverage: ${{ needs.frontend.outputs.coverage }}
            Frontend branch coverage: ${{ needs.frontend.outputs.branch_coverage }}

            View Changes:
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            View CI Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
