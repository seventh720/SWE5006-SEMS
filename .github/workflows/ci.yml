name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile, test and generate backend coverage
        working-directory: backend
        run: mvn -B verify
      - name: Summarize backend line coverage
        id: coverage
        if: always()
        working-directory: backend
        shell: bash
        run: |
          report="target/site/jacoco/jacoco.csv"
          if [[ ! -f "$report" ]]; then
            echo "percentage=N/A" >> "$GITHUB_OUTPUT"
            echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          percentage="$(awk -F, 'NR > 1 { missed += $8; covered += $9 } END { total = missed + covered; if (total == 0) print "0.0"; else printf "%.1f", covered * 100 / total }' "$report")"
          echo "percentage=$percentage" >> "$GITHUB_OUTPUT"
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Line coverage: **${percentage}%**" >> "$GITHUB_STEP_SUMMARY"

  backend-integration:
    runs-on: ubuntu-latest
    env:
      RUN_CONTAINER_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  notify:
    name: Telegram notification
    if: always()
    needs: [backend, backend-integration, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Send CI result
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_INTEGRATION_RESULT: ${{ needs['backend-integration'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_COVERAGE: ${{ needs.backend.outputs.coverage }}
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets are not configured; notification skipped."
            exit 0
          fi

          overall="success"
          icon="✅"
          for result in "$BACKEND_RESULT" "$BACKEND_INTEGRATION_RESULT" "$FRONTEND_RESULT"; do
            if [[ "$result" != "success" ]]; then
              overall="failed"
              icon="❌"
              break
            fi
          done

          backend_coverage="${BACKEND_COVERAGE:-N/A}"
          [[ "$backend_coverage" != "N/A" ]] && backend_coverage="${backend_coverage}%"

          message="${icon} SEMS CI ${overall}
          Repository: ${GITHUB_REPOSITORY}
          Event: ${GITHUB_EVENT_NAME}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA:0:7}
          Backend: ${BACKEND_RESULT} | line coverage: ${backend_coverage}
          PostgreSQL integration: ${BACKEND_INTEGRATION_RESULT}
          Frontend: ${FRONTEND_RESULT}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl --silent --show-error --fail --retry 3 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true"
