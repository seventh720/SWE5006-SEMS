name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile, test and generate backend coverage
        working-directory: backend
        run: mvn -B verify
      - name: Summarize backend line coverage
        id: coverage
        if: always()
        working-directory: backend
        shell: bash
        run: |
          report="target/site/jacoco/jacoco.csv"
          if [[ ! -f "$report" ]]; then
            echo "percentage=N/A" >> "$GITHUB_OUTPUT"
            echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          percentage="$(awk -F, 'NR > 1 { missed += $8; covered += $9 } END { total = missed + covered; if (total == 0) print "0.0"; else printf "%.1f", covered * 100 / total }' "$report")"
          echo "percentage=${percentage}%" >> "$GITHUB_OUTPUT"
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Line coverage: **${percentage}%**" >> "$GITHUB_STEP_SUMMARY"

  backend-integration:
    runs-on: ubuntu-latest
    env:
      RUN_CONTAINER_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  notify:
    name: Telegram notification
    if: always()
    needs: [backend, backend-integration, frontend]
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Telegram configuration check
        if: "${{ env.TELEGRAM_TO == '' || env.TELEGRAM_TOKEN == '' }}"
        run: echo "Telegram secrets are not configured; notification skipped."
      - name: Send Telegram message
        if: "${{ env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != '' }}"
        continue-on-error: true
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            ${{ needs.backend.result == 'success' && needs['backend-integration'].result == 'success' && needs.frontend.result == 'success' && '✅ SEMS CI success' || '❌ SEMS CI failed' }}

            User: ${{ github.actor }}
            Repository: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit Message: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}

            Backend: ${{ needs.backend.result }}
            Backend line coverage: ${{ needs.backend.outputs.coverage }}
            PostgreSQL integration: ${{ needs['backend-integration'].result }}
            Frontend: ${{ needs.frontend.result }}

            View Changes:
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            View CI Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
