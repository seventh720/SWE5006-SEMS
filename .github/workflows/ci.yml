name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: npm ci
        working-directory: frontend
      - name: Run lint and collect reports
        run: bash scripts/ci/lint.sh
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report
          path: lint-reports/
          retention-days: 7


  security:
    name: Security · SAST, Dependencies & Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-jar
          path: backend/target/
      - run: bash scripts/security/scan.sh
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sast-report
          path: security-reports/semgrep.json
          retention-days: 7
      - name: Upload dependency and secret reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-secret-reports
          path: security-reports/trivy-*.json
          retention-days: 7


  backend:
    name: Backend · Unit Tests
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.line }}
      branch_coverage: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile, test and generate backend coverage
        working-directory: backend
        run: mvn -B clean verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-jar
          path: backend/target/sems-backend-*.jar
          if-no-files-found: error
          retention-days: 1
      - name: Summarize unit-test coverage
        id: coverage
        if: always()
        run: python3 scripts/ci/backend-coverage.py backend/target/site/jacoco/jacoco.xml "Backend unit tests"
      - name: Upload unit-test coverage and results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-unit-coverage
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/

  backend-integration:
    name: Backend · Integration Tests
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.line }}
      branch_coverage: ${{ steps.coverage.outputs.branch }}
    env:
      RUN_CONTAINER_TESTS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit and PostgreSQL integration tests
        working-directory: backend
        run: mvn -B clean verify
      - name: Summarize combined coverage
        id: coverage
        if: always()
        run: python3 scripts/ci/backend-coverage.py backend/target/site/jacoco/jacoco.xml "Backend unit + PostgreSQL integration tests"
      - name: Upload combined coverage and results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-combined-coverage
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/

  frontend:
    name: Frontend · Tests & Build
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.line }}
      branch_coverage: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Summarize frontend coverage
        id: coverage
        if: always()
        run: python3 scripts/ci/frontend-coverage.py frontend/coverage/coverage-summary.json
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  images:
    name: Images · Scan & Smoke Test
    needs: [lint, backend, backend-integration, frontend, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-jar
          path: backend/target/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Build and scan runtime images
        run: bash scripts/cd/images.sh
      - name: Exercise exact images with an isolated database
        run: bash scripts/cd/image-smoke.sh
      - name: Publish tested images on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: bash scripts/cd/publish-images.sh
      - name: Upload image scan and smoke reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-security-reports
          path: image-reports/
          retention-days: 7
      - name: Upload release image digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-images
          path: image-reports/compose.release.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy · Staging
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://swe5006.seventh720.com
    concurrency:
      group: swe5006-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Check this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v8.0.2
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: release-images
          path: image-reports/
      - name: Back up database, deploy tested images and check HTTPS
        if: steps.latest.outputs.deploy == 'true'
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: bash scripts/cd/remote-deploy.sh
      - name: Record deployment result
        if: steps.latest.outputs.deploy == 'true'
        run: |
          echo "Deployed $GITHUB_SHA to https://swe5006.seventh720.com" >> "$GITHUB_STEP_SUMMARY"
          echo "Database backup retained on Lightsail before deployment." >> "$GITHUB_STEP_SUMMARY"

  dast:
    name: Security · DAST Baseline
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: swe5006-dast
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Confirm the deployed release matches this run
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping DAST for superseded commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Scan public HTTPS pages and APIs
        if: steps.latest.outputs.scan == 'true'
        run: bash scripts/security/dast.sh https://swe5006.seventh720.com
      - name: Summarize DAST
        if: always()
        run: |
          if [ -f dast-reports/summary.md ]; then
            cat dast-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload DAST reports
        if: always() && steps.latest.outputs.scan == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dast-report
          path: dast-reports/
          if-no-files-found: error
          retention-days: 7

  notify:
    name: Notify · Telegram
    if: always()
    needs: [lint, security, backend, backend-integration, frontend, images, deploy, dast]
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Telegram configuration check
        if: "${{ env.TELEGRAM_TO == '' || env.TELEGRAM_TOKEN == '' }}"
        run: echo "Telegram secrets are not configured; notification skipped."
      - name: Send Telegram message
        if: "${{ env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != '' }}"
        continue-on-error: true
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            ${{ ((needs.deploy.result == 'success' && needs.dast.result == 'success') || (github.event_name == 'pull_request' && needs.deploy.result == 'skipped' && needs.dast.result == 'skipped')) && needs.images.result == 'success' && needs.lint.result == 'success' && needs.security.result == 'success' && needs.backend.result == 'success' && needs['backend-integration'].result == 'success' && needs.frontend.result == 'success' && '✅ SEMS CI/CD success' || '❌ SEMS CI/CD failed' }}

            User: ${{ github.actor }}
            Repository: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit Message: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}

            Lint: ${{ needs.lint.result }}
            Static security: ${{ needs.security.result }}
            DAST baseline: ${{ needs.dast.result }}
            Images: ${{ needs.images.result }}
            Staging deployment: ${{ needs.deploy.result }}
            Backend: ${{ needs.backend.result }}
            Backend unit-test line coverage: ${{ needs.backend.outputs.coverage }}
            Backend unit-test branch coverage: ${{ needs.backend.outputs.branch_coverage }}
            Backend combined line coverage: ${{ needs['backend-integration'].outputs.coverage }}
            Backend combined branch coverage: ${{ needs['backend-integration'].outputs.branch_coverage }}
            PostgreSQL integration: ${{ needs['backend-integration'].result }}
            Frontend: ${{ needs.frontend.result }}
            Frontend line coverage: ${{ needs.frontend.outputs.coverage }}
            Frontend branch coverage: ${{ needs.frontend.outputs.branch_coverage }}

            View Changes:
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            View CI Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
