# The cloud frontend is reachable only through the trusted shared HTTPS proxy.
map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Preserve the browser-facing port for same-origin checks in Spring.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
