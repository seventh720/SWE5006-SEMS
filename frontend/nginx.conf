# Reuse backend sockets across API and health requests.
upstream sems_backend {
    server backend:8080;
    keepalive 32;
}

# The cloud frontend is reachable only through the trusted shared HTTPS proxy.
map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}

map $external_scheme $hsts_header {
    default "";
    https "max-age=31536000";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # React uses style attributes; scripts and stylesheet elements stay same-origin.
    # data/blob images support ticket QR codes and local avatar previews.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Emit one consistent header value for static pages and proxied responses.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Preserve the browser-facing port for same-origin checks in Spring.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";

    location /api/ {
        proxy_pass http://sems_backend;
    }

    location /actuator/ {
        proxy_pass http://sems_backend;
    }

    location / {
        try_files $uri /index.html;
    }
}
